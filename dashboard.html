<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PodFeed</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --card: #1e1e24;
    --border: #2a2a32;
    --accent: #e8c547;
    --accent2: #f0a500;
    --text: #f0eff4;
    --muted: #888899;
    --tag-bg: rgba(232,197,71,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 0%, rgba(232,197,71,0.06) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 100%, rgba(240,165,0,0.04) 0%, transparent 60%);
  }

  .navbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,13,15,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .logo span {
    display: inline-block;
    background: var(--accent);
    color: #0d0d0f;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .nav-right { display: flex; align-items: center; gap: 16px; }

  .user-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .user-pill::before {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4caf8a;
    display: inline-block;
  }

  .btn-logout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-logout:hover { border-color: #ff5555; color: #ff5555; }

  .hero {
    text-align: center;
    padding: 56px 20px 40px;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -1px;
    color: var(--text);
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { color: var(--muted); font-size: 15px; margin-top: 12px; font-weight: 300; }

  .add-wrapper {
    max-width: 580px;
    margin: 0 auto 48px;
    padding: 0 20px;
    display: none;
  }

  .add-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    position: relative;
    overflow: hidden;
  }
  .add-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .add-box h3 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }

  .admin-badge {
    background: var(--accent);
    color: #0d0d0f;
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .field-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }

  .field-group input,
  .field-group textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
  }
  .field-group input::placeholder,
  .field-group textarea::placeholder { color: var(--muted); }
  .field-group input:focus,
  .field-group textarea:focus { border-color: var(--accent); }

  .btn-post {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #0d0d0f;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-post:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-post:active { transform: translateY(0); }

  .feed-wrapper { max-width: 620px; margin: 0 auto; padding: 0 20px 60px; }

  .feed-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .feed-title { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); font-weight: 600; }
  .count-badge {
    background: var(--tag-bg);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 100px;
    border: 1px solid rgba(232,197,71,0.2);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    display: flex;
    gap: 20px;
    align-items: flex-start;
    transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
    animation: fadeUp 0.4s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card:hover {
    border-color: rgba(232,197,71,0.35);
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }

  .card-icon {
    flex-shrink: 0;
    width: 52px; height: 52px;
    background: var(--tag-bg);
    border: 1px solid rgba(232,197,71,0.2);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }

  .card-body { flex: 1; min-width: 0; }
  .card-body h3 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 8px;
    color: var(--text);
  }
  .card-body p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 16px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    display: flex; align-items: center;
    justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }

  .open-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 18px;
    background: var(--accent);
    color: #0d0d0f;
    text-decoration: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .open-btn:hover { background: var(--accent2); transform: scale(1.03); }
  .open-btn svg { width: 14px; height: 14px; }

  .url-label {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
    font-family: monospace;
  }

  /* DELETE BTN - admin only */
  .delete-btn {
    background: transparent;
    border: 1px solid #ff5555;
    color: #ff5555;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .delete-btn:hover { background: #ff5555; color: white; }

  .empty { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty h3 { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text); margin-bottom: 8px; }
  .empty p { font-size: 14px; }

  .loading { text-align: center; padding: 60px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<div class="navbar">
  <div class="logo">🎙 PodFeed <span>Beta</span></div>
  <div class="nav-right">
    <div class="user-pill" id="user">Loading...</div>
    <button class="btn-logout" onclick="logout()">Sign out</button>
  </div>
</div>

<div class="hero">
  <h1>Your Podcast <em>Feed</em></h1>
  <p>Curated links, shared with your audience.</p>
</div>

<div class="add-wrapper" id="adminBox">
  <div class="add-box">
    <h3>Add Podcast <span class="admin-badge">Admin</span></h3>
    <div class="field-group">
      <input type="text" id="title" placeholder="Podcast title…">
      <textarea id="desc" placeholder="Short description…" rows="3"></textarea>
      <input type="url" id="audio" placeholder="Paste podcast URL (YouTube, Spotify, website…)">
    </div>
    <button class="btn-post" onclick="addPodcast()">Publish →</button>
  </div>
</div>

<div class="feed-wrapper">
  <div class="feed-header">
    <span class="feed-title">Latest Episodes</span>
    <span class="count-badge" id="countBadge">Loading…</span>
  </div>
  <div id="feed"><div class="loading">⏳ Loading podcasts…</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot,
  orderBy,
  query,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCRcmNB91AUXeMBmfZ8LRE_aHyVtkGlrGE",
  authDomain: "login-app-a8543.firebaseapp.com",
  projectId: "login-app-a8543",
  storageBucket: "login-app-a8543.firebasestorage.app",
  messagingSenderId: "218636859286",
  appId: "1:218636859286:web:dac8962d65040f76a88fb7"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const ADMIN = "jacobwilsonp27@gmail.com";
let isAdmin = false;

// ── Auth ──────────────────────────────────────────────
onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = "index.html"; return; }

  document.getElementById("user").innerText = user.email;

  isAdmin = user.email === ADMIN;
  if (isAdmin) document.getElementById("adminBox").style.display = "block";

  // 🔥 REAL-TIME LISTENER — updates instantly for ALL users worldwide
  const q = query(collection(db, "podcasts"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snapshot) => {
    renderPodcasts(snapshot.docs);
  });
});

// ── Logout ────────────────────────────────────────────
window.logout = function () {
  signOut(auth).then(() => { window.location.href = "index.html"; });
};

// ── Add Podcast (Admin only) ──────────────────────────
window.addPodcast = async function () {
  if (!isAdmin) { alert("❌ Admins only"); return; }

  const title = document.getElementById("title").value.trim();
  const desc  = document.getElementById("desc").value.trim();
  const audio = document.getElementById("audio").value.trim();

  if (!title || !audio) { alert("Please fill in title and URL."); return; }

  // ✅ Saves to Firestore — visible to ALL users instantly
  await addDoc(collection(db, "podcasts"), {
    title,
    desc,
    audio,
    createdAt: serverTimestamp()
  });

  document.getElementById("title").value = "";
  document.getElementById("desc").value  = "";
  document.getElementById("audio").value = "";
};

// ── Delete Podcast (Admin only) ───────────────────────
window.deletePodcast = async function (id) {
  if (!isAdmin) return;
  if (!confirm("Delete this podcast?")) return;
  await deleteDoc(doc(db, "podcasts", id));
};

// ── Render ────────────────────────────────────────────
function getHostname(url) {
  try { return new URL(url).hostname.replace("www.", ""); }
  catch { return url; }
}

const icons = ["🎧","🎙","📻","🎵","🎤","📡"];

function renderPodcasts(docs) {
  const feed = document.getElementById("feed");
  const count = docs.length;

  document.getElementById("countBadge").textContent =
    count === 1 ? "1 post" : `${count} posts`;

  if (count === 0) {
    feed.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🎙</div>
        <h3>No episodes yet</h3>
        <p>Admin will post podcast links here soon.</p>
      </div>`;
    return;
  }

  feed.innerHTML = docs.map((d, i) => {
    const p = d.data();
    return `
      <div class="card" style="animation-delay:${i * 0.07}s">
        <div class="card-icon">${icons[i % icons.length]}</div>
        <div class="card-body">
          <h3>${p.title}</h3>
          ${p.desc ? `<p>${p.desc}</p>` : ""}
          <div class="card-footer">
            <a href="${p.audio}" target="_blank" rel="noopener" class="open-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>
              </svg>
              Listen Now
            </a>
            <span class="url-label">${getHostname(p.audio)}</span>
            ${isAdmin ? `<button class="delete-btn" onclick="deletePodcast('${d.id}')">🗑 Delete</button>` : ""}
          </div>
        </div>
      </div>`;
  }).join("");
}
</script>
</body>
</html>
